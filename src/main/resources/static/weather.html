<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气预报</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "SimSun", sans-serif; background: linear-gradient(180deg, #f0f7ff 0%, #e8f4fc 100%); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { background: linear-gradient(135deg, #4A90A4, #3d7a8c); padding: 20px 0; position: sticky; top: 0; z-index: 100; }
        .header-content { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 700; color: #fff; text-decoration: none; }
        .search-box { display: flex; gap: 10px; }
        .search-box input { padding: 10px 18px; border: none; border-radius: 25px; font-size: 14px; width: 200px; outline: none; }
        .search-box button { padding: 10px 20px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: #fff; border-radius: 25px; cursor: pointer; }
        .search-box button:hover { background: rgba(255,255,255,0.3); }
        .current-weather { background: linear-gradient(135deg, #4A90A4, #5BA3B8); border-radius: 24px; padding: 40px; color: #fff; margin: 30px 0; }
        .current-weather h1 { font-size: 36px; margin-bottom: 10px; }
        .weather-main { display: flex; align-items: center; gap: 40px; margin: 20px 0; }
        .weather-icon { font-size: 100px; }
        .temperature { font-size: 72px; font-weight: 300; }
        .weather-details { display: flex; gap: 30px; margin-top: 20px; font-size: 16px; opacity: 0.9; }
        .detail-item { display: flex; align-items: center; gap: 8px; }
        .chart-section { background: #fff; border-radius: 24px; padding: 30px; margin: 30px 0; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .chart-section h2 { font-size: 24px; color: #4A90A4; margin-bottom: 20px; }
        .chart-container { position: relative; height: 350px; }
        .forecast-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 30px; }
        .forecast-card { background: linear-gradient(180deg, #f8fbfd 0%, #edf4f8 100%); border-radius: 16px; padding: 20px; text-align: center; }
        .forecast-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(74,144,164,0.15); }
        .forecast-date { font-size: 14px; color: #888; margin-bottom: 10px; }
        .forecast-icon { font-size: 36px; margin: 10px 0; }
        .forecast-temps { font-size: 18px; font-weight: 600; color: #4A90A4; }
        .forecast-temps span { color: #999; font-weight: normal; }
        .forecast-text { font-size: 12px; color: #666; margin-top: 8px; }
        .loading { text-align: center; padding: 60px; color: #888; }
        .loading-white { text-align: center; padding: 60px; color: #fff; }
        .spinner { width: 50px; height: 50px; border: 4px solid #eee; border-top-color: #4A90A4; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        .spinner-white { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="/" class="logo">诗词大全 - 天气预报</a>
            <div class="search-box">
                <input type="text" id="city-input" placeholder="输入城市名称..." onkeydown="if(event.key==='Enter')searchCity()">
                <button onclick="searchCity()">搜索</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div id="current-weather">
            <div class="loading-white"><div class="spinner-white"></div><p>加载天气数据...</p></div>
        </div>

        <div class="chart-section" id="chart-section" style="display:none;">
            <h2>15天温度趋势</h2>
            <div class="chart-container"><canvas id="tempChart"></canvas></div>
        </div>

        <div class="chart-section" id="forecast-section" style="display:none;">
            <h2>15天天气预报</h2>
            <div class="forecast-grid" id="forecast-grid"></div>
        </div>
    </div>

    <script>
        var tempChart = null;
        var currentLat = 22.5431;
        var currentLon = 114.0579;
        var currentCity = '深圳';

        window.onload = function() {
            console.log('Page loaded');
            var params = new URLSearchParams(window.location.search);
            if (params.get('lat')) currentLat = parseFloat(params.get('lat'));
            if (params.get('lon')) currentLon = parseFloat(params.get('lon'));
            if (params.get('city')) currentCity = decodeURIComponent(params.get('city'));
            
            console.log('Initial params:', currentCity, currentLat, currentLon);
            document.getElementById('city-input').value = currentCity;
            
            loadCurrentWeather();
            loadForecast();
        };

        function loadCurrentWeather() {
            console.log('loadCurrentWeather called');
            var url = '/api/weather/current?lat=' + currentLat + '&lon=' + currentLon;
            console.log('Current weather URL:', url);
            
            fetch(url)
                .then(function(response) {
                    console.log('Current weather response status:', response.status);
                    return response.json();
                })
                .then(function(result) {
                    console.log('Current weather result:', result);
                    if (result.code === 200 && result.data) {
                        renderCurrentWeather(result.data);
                    }
                })
                .catch(function(error) {
                    console.error('loadCurrentWeather error:', error);
                    document.getElementById('current-weather').innerHTML = '<div class="loading-white"><p>加载失败</p></div>';
                });
        }

        function loadForecast() {
            console.log('loadForecast called');
            var url = '/api/weather/forecast?lat=' + currentLat + '&lon=' + currentLon;
            console.log('Forecast URL:', url);
            
            fetch(url)
                .then(function(response) {
                    console.log('Forecast response status:', response.status);
                    return response.json();
                })
                .then(function(result) {
                    console.log('Forecast result:', result);
                    if (result.code === 200 && result.data && result.data.length > 0) {
                        renderChart(result.data);
                        renderForecastCards(result.data);
                        document.getElementById('chart-section').style.display = 'block';
                        document.getElementById('forecast-section').style.display = 'block';
                    }
                })
                .catch(function(error) {
                    console.error('loadForecast error:', error);
                });
        }

        function renderCurrentWeather(weather) {
            console.log('renderCurrentWeather called with:', weather);
            console.log('weather.cityName:', weather.cityName);
            console.log('currentCity:', currentCity);
            
            var cityName = weather.cityName;
            console.log('Using cityName:', cityName);
            
            if (!cityName || cityName === '') {
                cityName = currentCity;
            }
            
            var html = '<h1>' + cityName + '</h1>' +
                '<div class="weather-main">' +
                    '<span class="weather-icon">' + getWeatherEmoji(weather.weatherCode) + '</span>' +
                    '<div><div class="temperature">' + Math.round(weather.temperature) + '°C</div>' +
                    '<div style="font-size:20px;opacity:0.9;">' + weather.weatherText + '</div></div>' +
                '</div>' +
                '<div class="weather-details">' +
                    '<div class="detail-item">🌡️ 体感 ' + Math.round(weather.feelsLike) + '°C</div>' +
                    '<div class="detail-item">💧 湿度 ' + weather.humidity + '%</div>' +
                    '<div class="detail-item">🌬️ ' + (weather.windDirection || '未知') + ' ' + weather.windSpeed + ' km/h</div>' +
                    '<div class="detail-item">🕐 ' + weather.localTime + '</div>' +
                '</div>';
            document.getElementById('current-weather').innerHTML = html;
        }

        function renderChart(forecasts) {
            console.log('renderChart called, data length:', forecasts.length);
            var ctx = document.getElementById('tempChart').getContext('2d');
            
            if (tempChart) {
                tempChart.destroy();
            }

            var labels = forecasts.map(function(f) {
                var date = new Date(f.date);
                return (date.getMonth() + 1) + '/' + date.getDate();
            });
            var maxTemps = forecasts.map(function(f) { return f.tempMax; });
            var minTemps = forecasts.map(function(f) { return f.tempMin; });

            tempChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '最高温度', data: maxTemps, borderColor: '#ff6b6b', tension: 0.4, fill: false },
                        { label: '最低温度', data: minTemps, borderColor: '#4ecdc4', tension: 0.4, fill: false }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { ticks: { callback: function(v) { return v + '°C'; } } }
                    }
                }
            });
        }

        function renderForecastCards(forecasts) {
            console.log('renderForecastCards called, data length:', forecasts.length);
            var container = document.getElementById('forecast-grid');
            var dayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            var html = '';
            
            forecasts.forEach(function(f) {
                var date = new Date(f.date);
                var dateStr = (date.getMonth() + 1) + '月' + date.getDate() + '日 ' + dayNames[date.getDay()];
                
                html += '<div class="forecast-card">' +
                    '<div class="forecast-date">' + dateStr + '</div>' +
                    '<div class="forecast-icon">' + getWeatherEmoji(f.weatherCode) + '</div>' +
                    '<div class="forecast-temps">' + Math.round(f.tempMax) + '° <span>/ ' + Math.round(f.tempMin) + '°</span></div>' +
                    '<div class="forecast-text">' + f.weatherText + '</div>' +
                    '<div class="forecast-text">💧 ' + Math.round(f.precipitationProbability) + '%</div>' +
                '</div>';
            });
            
            container.innerHTML = html;
        }

        function searchCity() {
            var cityName = document.getElementById('city-input').value.trim();
            console.log('searchCity called with:', cityName);
            if (!cityName) return;

            fetch('/api/weather/current?city=' + encodeURIComponent(cityName))
                .then(function(response) { return response.json(); })
                .then(function(result) {
                    console.log('searchCity result:', result);
                    if (result.code === 200 && result.data) {
                        currentLat = parseFloat(result.data.latitude.toFixed(4));
                        currentLon = parseFloat(result.data.longitude.toFixed(4));
                        currentCity = result.data.cityName;
                        
                        console.log('Updated params:', currentCity, currentLat, currentLon);
                        window.history.pushState({}, '', '?lat=' + currentLat + '&lon=' + currentLon + '&city=' + encodeURIComponent(currentCity));
                        
                        document.getElementById('current-weather').innerHTML = '<div class="loading-white"><div class="spinner-white"></div><p>加载天气数据...</p></div>';
                        document.getElementById('chart-section').style.display = 'none';
                        document.getElementById('forecast-section').style.display = 'none';
                        
                        renderCurrentWeather(result.data);
                        loadForecast();
                    } else {
                        alert('未找到该城市，请检查输入');
                    }
                })
                .catch(function(error) {
                    console.error('searchCity error:', error);
                    alert('搜索失败，请稍后重试');
                });
        }

        function getWeatherEmoji(code) {
            var codeNum = parseInt(code);
            if (codeNum === 0) return '☀️';
            if (codeNum <= 3) return '⛅';
            if (codeNum <= 48) return '🌫️';
            if (codeNum <= 57) return '🌧️';
            if (codeNum <= 67) return '🌧️';
            if (codeNum <= 77) return '❄️';
            if (codeNum <= 82) return '🌧️';
            if (codeNum <= 86) return '🌨️';
            if (codeNum >= 95) return '⛈️';
            return '🌤️';
        }
    </script>
</body>
</html>
